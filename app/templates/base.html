<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MotionClipper KL{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>MotionClipper KL</a>
    <nav>
      <a href="/" class="{% if active == 'home' %}on{% endif %}">Beranda</a>
      <a href="/jobs/new" class="{% if active == 'new' %}on{% endif %}">Job baru</a>
      <a href="/settings" class="{% if active == 'settings' %}on{% endif %}">Pengaturan</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v=1"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
